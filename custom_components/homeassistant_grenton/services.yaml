run_scene:
  name: Run scene
  description: Run a configured Grenton scene action, optionally overriding its arguments/value for one call.
  target:
    entity:
      integration: grenton
      domain: button
  fields:
    parameter:
      name: Parameter
      description: >-
        Omit to use the saved arguments/value. Scripts accept Lua arguments
        (e.g. quoted "abc", 42, or 42, "abc"). Other call types accept a string
        value without surrounding quotes. An explicitly empty string clears
        the arguments/value for this call. Use either parameter or arguments.
      example: '"123"'
      required: false
      selector:
        text:
    arguments:
      name: Typed arguments
      description: >-
        Script/method arguments with types. Add, edit, delete, or reorder rows.
        Omit to use saved arguments; an empty list calls without arguments.
        Use either parameter or arguments.
      required: false
      selector:
        grenton_arguments: {}
