run_script:
  name: Run script
  description: Run a named Grenton script directly on a discovered CLU.
  target:
    entity:
      integration: grenton
      domain: sensor
    device:
      integration: grenton
      manufacturer: Grenton
      model: CLU
  fields:
    script:
      name: Script
      description: Name of the script on the selected CLU, without parentheses or arguments.
      example: Evening
      required: true
      selector:
        text:
    arguments:
      name: Typed arguments
      description: Positional arguments. Add, edit, remove, or reorder rows. Omit trailing arguments to use the script's defaults; omit this field or use an empty list to call without arguments.
      required: false
      selector:
        grenton_arguments: {}
